<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DCL Cars | Forgot Password</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;

    background:
    linear-gradient(
    rgba(0,0,0,.65),
    rgba(0,0,0,.65)
    ),
    url("https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=1600");

    background-size:cover;
    background-position:center;
}

.reset-card{
    background:rgba(255,255,255,.12);

    backdrop-filter:blur(15px);

    border-radius:20px;

    padding:35px;

    color:white;
}

.btn-reset{
    background:#ff6b00;
    border:none;
}

.btn-reset:hover{
    background:#e55f00;
}

.back-link{
    color:#ffb26b;
    text-decoration:none;
}

</style>

</head>
<body>

<div class="container">

<div class="row justify-content-center align-items-center vh-100">

<div class="col-lg-5">

<div class="reset-card">

<h2 class="text-center mb-3">
Forgot Password
</h2>

<p class="text-center mb-4">
Enter your registered email address and we'll send a password reset link.
</p>

<form id="resetForm">

<div class="mb-3">

<label class="form-label">
Email Address
</label>

<input
type="email"
class="form-control"
id="email"
placeholder="Enter your email"
required>

</div>

<button
type="submit"
class="btn btn-reset text-white w-100">

Send Reset Link

</button>

</form>

<div class="text-center mt-4">

<a href="login.html" class="back-link">
← Back to Login
</a>

</div>

</div>

</div>

</div>

</div>

<script>

document
.getElementById("resetForm")
.addEventListener("submit",(e)=>{

e.preventDefault();

const email =
document.getElementById("email").value;

alert(
"Password reset link sent to " + email
);

});

</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
