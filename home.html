<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DCLCars</title>
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
 
  <!-- Navbar -->
  <nav>
    <a class="brand" href="#">DCLCars</a>
    <div class="nav-links">
      <button class="active" onclick="setFilter('all', this)">All Cars</button>
      <button onclick="setFilter('new', this)">New</button>
      <button onclick="setFilter('old', this)">Pre-owned</button>
      <a href="valuation.html" style="color: var(--text-muted); text-decoration: none; font-size: 0.85rem; padding: 6px 14px; font-weight: 500; font-family: 'Inter', sans-serif; transition: color 0.2s;">Check Value</a>
      <a href="sell.html" class="sell-btn">Sell Your Car</a>
    </div>
  </nav>
 
  <!-- Hero -->
  <div class="hero">
    <p class="hero-eyebrow">India's Premier Auto Marketplace</p>
    <h1>Find Your<br><span>Dream Car</span></h1>
    <p class="hero-sub">Best new &amp; used cars at unbeatable prices</p>
  </div>
 
  <!-- Search & Filters -->
  <div class="controls">
    <div class="search-wrap">
      <i class="ti ti-search" aria-hidden="true"></i>
      <input type="text" id="searchInput" placeholder="Search by name, brand, fuel type…">
    </div>
    <div class="filter-btns">
      <button class="active" onclick="setFilter('all', this)">All</button>
      <button onclick="setFilter('new', this)">New</button>
      <button onclick="setFilter('old', this)">Pre-owned</button>
    </div>
  </div>
 
  <!-- Count Bar -->
  <div class="count-bar" id="countBar"><span>0</span> cars available</div>
 
  <!-- Cars Grid -->
  <div class="grid" id="carsContainer"></div>
 
  <script src="js/carsData.js"></script>
  <script src="js/home.js"></script>
 
</body>
</html>
