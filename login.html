</head>
<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a class="navbar-brand" href="login.html">
DCLCars

<button
class="navbar-toggler"
type="button"
data-bs-toggle="collapse"
data-bs-target="#navbarNav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="navbarNav">

<ul class="navbar-nav ms-auto">

<li class="nav-item">

<div class="login-wrapper">

<div class="container">

<div class="row justify-content-center align-items-center">

<div class="col-lg-5 col-md-7 col-sm-9">

<div class="login-card">

<h2 class="text-center mb-3">
Welcome Back
</h2>

<p class="text-center mb-4">
Sign in to continue your journey.
</p>

<form id="loginForm">

<div class="mb-3">

<label class="form-label" for="email">
Email Address
</label>

<input
type="email"
id="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

<div class="mb-3">

<label class="form-label" for="password">
Password
</label>

<div class="position-relative">
<input
type="password"
id="password"
class="form-control"
placeholder="Enter password"
required>
<span id="togglePassword" style="position: absolute; right: 15px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--text-muted); z-index: 10;">👁</span>
</div>

</div>

<div class="d-flex justify-content-between mb-4">

<div class="form-check">
<input type="checkbox" class="form-check-input" id="rememberMe">
<label class="form-check-label" for="rememberMe" style="font-size: 0.9rem; cursor: pointer;">Remember Me</label>
</div>

<a href="forgotpassword.html"
class="forgot-link" style="font-size: 0.9rem;">
Forgot Password?
</a>

</div>

<button
type="submit"
class="btn login-btn w-100 mb-3" style="border-radius: 8px;">
Login
</button>

<div class="text-center my-3 text-muted" style="font-size: 0.85rem;">or</div>

<button
type="button"
class="btn btn-light w-100 d-flex align-items-center justify-content-center" style="border-radius: 8px; padding: 12px;">
<svg class="me-2" width="16" height="16" viewBox="0 0 48 48">
  <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
  <path fill="#4285F4" d="M46.5 24c0-1.61-.15-3.16-.42-4.69H24v8.89h12.66c-.55 2.87-2.17 5.3-4.61 6.94l7.15 5.54C43.32 36.31 46.5 30.73 46.5 24z"/>
  <path fill="#FBBC05" d="M10.54 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.98-6.19z"/>
  <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.15-5.54c-1.98 1.32-4.52 2.1-8.74 2.1-6.26 0-11.57-4.22-13.46-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
</svg>
Continue with Google
</button>

<p class="text-center mt-4 register-link" style="font-size: 0.95rem; margin-bottom: 0;">
Don't have an account?
<a href="register.html">
Register Now
</a>
</p>

</form>

</div>

</div>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>

</body>
</html>
