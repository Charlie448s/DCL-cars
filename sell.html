<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sell Your Car - DCLCars</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.30.0/dist/tabler-icons.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/home.css">
  <link rel="stylesheet" href="./css/sell.css">
</head>
<body>
  <nav>
    <a class="brand" href="home.html">
      DCLCars
    </a>
    <div class="nav-links">
      <a href="home.html" style="color: var(--text); text-decoration: none; font-size: 0.85rem;">Back to Home</a>
    </div>
  </nav>

  <div class="page sell-page">
    <div class="form-container">
      <div class="car-header">
        <h1 class="car-title" style="font-size: 2.5rem;">Sell Your Car</h1>
        <p style="color: var(--text-muted); font-size: 0.9rem;">Fill in the details to list your car on DCLCars.</p>
      </div>

      <form id="sellForm" class="sell-form">
        <div class="form-grid">
          <div class="input-group">
            <label>Car Name</label>
            <input type="text" id="name" required placeholder="e.g. Honda City">
          </div>
          <div class="input-group">
            <label>Brand</label>
            <input type="text" id="brand" required placeholder="e.g. Honda">
          </div>
          <div class="input-group">
            <label>Year</label>
            <input type="number" id="year" required placeholder="e.g. 2020" min="1990" max="2025">
          </div>
          <div class="input-group">
            <label>Price (₹)</label>
            <input type="number" id="price" required placeholder="e.g. 1200000">
          </div>
          <div class="input-group">
            <label>Fuel Type</label>
            <select id="fuel" required>
              <option value="Petrol">Petrol</option>
              <option value="Diesel">Diesel</option>
              <option value="Electric">Electric</option>
              <option value="CNG">CNG</option>
            </select>
          </div>
          <div class="input-group">
            <label>Transmission</label>
            <select id="transmission" required>
              <option value="Automatic">Automatic</option>
              <option value="Manual">Manual</option>
            </select>
          </div>
          <div class="input-group">
            <label>Owner Type</label>
            <select id="owner" required>
              <option value="First Owner">First Owner</option>
              <option value="Second Owner">Second Owner</option>
              <option value="Third Owner">Third Owner</option>
            </select>
          </div>
          <div class="input-group">
            <label>Kms Driven</label>
            <input type="text" id="kmsDriven" required placeholder="e.g. 68,500 km">
          </div>
          <div class="input-group">
            <label>Mileage</label>
            <input type="text" id="mileage" required placeholder="e.g. 17 kmpl">
          </div>
          <div class="input-group">
            <label>Engine</label>
            <input type="text" id="engine" required placeholder="e.g. 1498 cc">
          </div>
          <div class="input-group">
            <label>Seats</label>
            <input type="number" id="seats" required placeholder="e.g. 5">
          </div>
          <div class="input-group">
            <label>Color</label>
            <input type="text" id="color" required placeholder="e.g. Grey">
          </div>
        </div>

        <div class="input-group full-width" style="grid-column: 1 / -1;">
          <label>Image URLs (One per line)</label>
          <textarea id="images" required placeholder="https://example.com/car1.jpg&#10;https://example.com/car2.jpg" rows="3"></textarea>
        </div>

        <button type="submit" class="submit-btn">List My Car</button>
      </form>
    </div>
  </div>

  <script src="./js/carsData.js"></script>
  <script src="./js/sell.js"></script>
</body>
</html>
